name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Testing Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Tests
        run: dotnet test Tests/Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: "**/test-results.trx"
          reporter: dotnet-trx

  deploy:
    name: Deploy UPM branch
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version and deploy
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Calculate semantic version from run_number (e.g., 290 -> 0.2.90, 300 -> 0.3.0)
          RUN_NUM=${{ github.run_number }}
          MINOR=$((RUN_NUM / 100))
          PATCH=$((RUN_NUM % 100))
          NEW_VERSION="0.$MINOR.$PATCH"
          
          # Update package.json
          jq ".version = \"$NEW_VERSION\"" package.json > package.json.tmp && mv package.json.tmp package.json
          
          # Commit and push back to main branch [skip ci] to avoid loops
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin main

          # Create and switch to upm branch
          git checkout -b upm
          
          # Remove unrelated files for UPM-version
          rm -rf Tests
          rm -rf Tests.meta
          rm -rf .github
          rm -rf .idea
          rm -rf Documentation
          
          # Add and commit changes for upm branch
          git add -A
          git commit -m "Update UPM branch to $NEW_VERSION - $(date)"
          
          # Push the upm branch
          git push -f origin upm
